name: Validate lab YAML structure
on:
  push:
    paths:
      - 'labs/**'
      - 'scripts/check_manifests.py'
      - '.github/workflows/yaml-check.yml'
  pull_request:
permissions:
  contents: read
jobs:
  yaml-parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML==6.0.2'
      - name: Check Kubernetes YAML structure
        run: python scripts/check_manifests.py
